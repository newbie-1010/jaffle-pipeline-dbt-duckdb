version: 2

sources:
  - name: raw
    schema: raw
    description: "This is the raw data from the source"

    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}
        
    tables:
      - name: orders
        description: "This table contains order data"
        columns:
          - name: id
            data_tests: [unique, not_null]

      - name: payments
        description: "This table contains payment data"
        columns:
          - name: id
            data_tests: [unique, not_null]

      - name: customers
        description: "This table contains customer data"
        columns:
          - name: id
            data_tests: [unique, not_null]