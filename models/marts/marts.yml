version: 2

models:
  - name: fct_orders
    description: One row per order with total paid amount.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: dim_customers
    description: One row per customer with order history and lifetime value.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]